name: "datawise Action Prepare Build and running envs"
description: "datawise Action Prepare Build and running envs"
inputs:
  CHECKOUT:
    default: true 
    required: false
  PROJECT:
    required: false
  APP:
    required: false
  SERVICE:
    required: false
  INSTANCE:
    required: false
  VERSION:
    required: false
  RUN_BEFORE_STEPS:
    required: false
    default: "echo \"nothing to run\""
  RUN_AFTER_STEPS:
    required: false
    default: "echo \"nothing to run\""    
  SET_BUILDENVS:
    required: false
    default: true
  SET_ENVS:
    required: false
    default: true


runs:
  using: "composite"
  steps:

    - name: run before all steps
      id: run-before-steps
      shell: bash
      run: |
          bash -c "${{ inputs.RUN_BEFORE_STEPS }}" || true

    - name: Get Time
      id: time
      uses: nanzm/get-time-action@v1.1
      with:
        timeZone: 0
        format: 'YYYY-MM-DD_HH:mm:ss'

    - name: Checkout repo
      if: ${{ inputs.CHECKOUT == 'true' }}
      uses: actions/checkout@v4

    - name: Set PROJECT
      shell: bash
      run: |
        if [ "X${{ inputs.PROJECT }}" != "X" ]; then
          echo "PROJECT=${{ inputs.PROJECT }}" >> $GITHUB_ENV
        fi

    - name: Set APP
      shell: bash
      run: |
        if [ "X${{ inputs.APP }}" != "X" ]; then
          echo "APP=${{ inputs.APP }}" >> $GITHUB_ENV
        fi

    - name: Set SERVICE
      shell: bash
      run: |
        if [ "X${{ inputs.SERVICE }}" != "X" ]; then
          echo "SERVICE=${{ inputs.SERVICE }}" >> $GITHUB_ENV
        fi

    - name: Set INSTANCE 
      shell: bash
      run: |
        if [ "X${{ inputs.INSTANCE }}" != "X" ]; then
          echo "INSTANCE=${{ inputs.INSTANCE}}" >> $GITHUB_ENV
        else
          if [[ "${GITHUB_REF_NAME}" == release/*/* ]]; then
            # Tag format: release/<instance>/<version> , keep only the <instance> as INSTANCE_NAME
            echo "Found release/*/* pattern, keeping only the last part"
            INSTANCE_NAME=$(echo "${GITHUB_REF_NAME#release/}" | cut -d'/' -f1)
          elif [[ "${GITHUB_REF_NAME}" == deploy/* ]]; then
            # Tag format: deploy/......, strip the deploy part
            echo "Found deploy/* pattern, stripping deploy"
            INSTANCE_NAME="${GITHUB_REF_NAME#deploy/}"
          else
            # Branches: take basename of ref_name (e.g. devops/foo/bar -> bar)
            INSTANCE_NAME="${{ github.ref_name }}"  
          fi
          #Since we use the INSTANCE_NAME in the helm release name, and the release name does not support _, we cleanup
          INSTANCE_NAME=$(echo "$INSTANCE_NAME" | sed 's/[^A-Za-z0-9_]//g')
          echo "INSTANCE=$INSTANCE_NAME" >> $GITHUB_ENV
        fi

    - name: Set VERSION
      shell: bash
      run: |
        if [ "X${{ inputs.VERSION }}" != "X" ]; then
          RAW_VERSION="${{ inputs.VERSION }}"
        else
          if [[ "${GITHUB_REF_NAME}" == release/*/* ]]; then
            RAW_VERSION=$(echo "${GITHUB_REF_NAME#release/}" | cut -d'/' -f2-)
          else
            RAW_VERSION="${GITHUB_SHA:0:7}"
          fi
        fi

        # Keep both raw and normalized
        echo "RAW_VERSION=$RAW_VERSION" >> $GITHUB_ENV
        VERSION_NUM=$(echo "$RAW_VERSION" | tr '/-' '_' | sed 's/[^A-Za-z0-9._]/_/g')
        echo "VERSION=$VERSION_NUM" >> $GITHUB_ENV


    - name: Set SHORTSHA and BRANCH_NAME
      shell: bash
      run: |
        echo SHORTSHA=${GITHUB_SHA::7} >> $GITHUB_ENV
        echo "BRANCH_NAME=$(echo '${{ github.ref_name }}' \
          | tr '/.-' '_' \
          | sed 's/[^A-Za-z0-9_]/_/g')" >> $GITHUB_ENV
        
    - name: read default Build envs
      if: ${{ inputs.SET_BUILDENVS == 'true' }}
      shell: bash
      run: |
        echo "Looking for .github/buildenvs/default..."
        [ -f ".github/buildenvs/default" ] &&  echo ":rocket: loaded ".github/buildenvs/default" :rocket:"  >>  $GITHUB_STEP_SUMMARY
        (([ -f ".github/buildenvs/default" ] && cat ".github/buildenvs/default" | tee) || true) >> $GITHUB_ENV


    - name: read branch Build envs
      if: ${{ inputs.SET_BUILDENVS == 'true' }}
      shell: bash
      run: |
        echo "Looking for .github/buildenvs/${{ env.INSTANCE }}..."
        [ -f ".github/buildenvs/${{ env.INSTANCE }}" ] &&  echo ":rocket: loaded ".github/buildenvs/${{ env.INSTANCE }}" :rocket:"  >>  $GITHUB_STEP_SUMMARY
        (([ -f ".github/buildenvs/${{ env.INSTANCE }}" ] && cat ".github/buildenvs/${{ env.INSTANCE }}" | tee) || true) >> $GITHUB_ENV


    - name: read default env
      if: ${{ inputs.SET_ENVS == 'true' }}
      shell: bash
      run: |
        echo "Looking for .github/envs/default..."
        [ -f ".github/envs/default" ] &&  echo ":rocket: loaded .github/envs/default :rocket:"  >>  $GITHUB_STEP_SUMMARY
        (([ -f ".github/envs/default" ] && cat ".github/envs/default" | tee) || true) >> $GITHUB_ENV


    - name: read branch env
      if: ${{ inputs.SET_ENVS == 'true' }}
      shell: bash
      run: |
        echo "Looking for .github/envs/${{ env.INSTANCE }}..."
        [ -f ".github/envs/${{ env.INSTANCE }}" ] &&  echo ":rocket: loaded ".github/envs/${{ env.INSTANCE }}" :rocket:"  >>  $GITHUB_STEP_SUMMARY
        (([ -f ".github/envs/${{ env.INSTANCE }}" ] && cat ".github/envs/${{ env.INSTANCE }}" | tee) || true) >> $GITHUB_ENV

    - name: send info to summary
      id: echo2summary
      shell: bash
      run: |
          echo ''  >> $GITHUB_STEP_SUMMARY
          echo ":rocket: running vars :rocket:"  >>  $GITHUB_STEP_SUMMARY
          echo ''  >> $GITHUB_STEP_SUMMARY
          echo '| Variable | Value |'                        >> $GITHUB_STEP_SUMMARY
          echo '| :---: | :---: | '                          >> $GITHUB_STEP_SUMMARY
          echo '| ref | ${{ github.ref }} | '                >> $GITHUB_STEP_SUMMARY
          echo '| PROJECT | ${{ env.PROJECT }} | '           >> $GITHUB_STEP_SUMMARY
          echo '| APP | ${{ env.APP }} | '   >> $GITHUB_STEP_SUMMARY
          echo '| SERVICE | ${{ env.SERVICE }} | '   >> $GITHUB_STEP_SUMMARY
          echo '| INSTANCE | ${{ env.INSTANCE }} | '   >> $GITHUB_STEP_SUMMARY
          echo '| VERSION | ${{ env.VERSION }} | '   >> $GITHUB_STEP_SUMMARY
          echo '| SHORTSHA | ${{ env.SHORTSHA }} | '   >> $GITHUB_STEP_SUMMARY
          echo '| BRANCH_NAME | ${{ env.BRANCH_NAME }} | '   >> $GITHUB_STEP_SUMMARY          

    - name: run after all steps
      id: run-after-steps
      shell: bash
      run: |
        ${{ inputs.RUN_AFTER_STEPS }}  || true

